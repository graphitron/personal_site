<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jagadeeswaran — Product Designer</title>
    <meta name="description" content="Jagadeeswaran A R is a product designer crafting AI-first SaaS and consumer products — Ailaysa, Chaireader and more." />
    <meta property="og:title" content="Jagadeeswaran — Product Designer" />
    <meta property="og:description" content="Designing AI products that feel human." />
    <meta property="og:image" content="/img/work/ailaysa-1.jpg" />
    <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0C" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
